<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80"><defs><style>.bold-italic{font-family:'Inter',Arial,sans-serif;font-weight:900;font-style:italic;letter-spacing:-1px;}.reg-italic{font-family:'Inter',Arial,sans-serif;font-weight:300;font-style:italic;letter-spacing:0.5px;}.flash-gradient{fill:url(#flash-grad);}</style><linearGradient id="flash-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2563EB" stop-opacity="0"/><stop offset="50%" stop-color="#FFF" stop-opacity="1"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs><g id="velocity-lines"><path d="M10 38h25M5 44h20M15 50h15" stroke="#2563EB" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0,50;50,0;0,50" dur="1.5s" repeatCount="indefinite"/></path><path d="M5 44 L45 44" stroke="#2563EB" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/></g><g id="text"><text x="35" y="52" class="bold-italic" font-size="32" fill="#0F172A">Quick<tspan class="reg-italic" fill="#2563EB">Expo</tspan></text></g><g id="flash-effect" style="mix-blend-mode:overlay"><path d="M30 25 L50 25 L40 65 L20 65 Z" class="flash-gradient" opacity="0.6"><animate transform="attributeName" attributeName="transform" type="translate" from="-100 0" to="250 0" dur="2s" repeatCount="indefinite"/></path></g><path d="M38 35 L32 45 L38 55" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/></svg>